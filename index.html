<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Cadence</title>
<meta name="description" content="トレーニングの記録・インターバルタイマー・体組成をまとめて管理する、オフラインで動くアプリ。">
<meta name="theme-color" content="#080B0F">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<!-- iOS でホーム画面から全画面起動するための指定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Cadence">

<style>
/* 見出し用の欧文フォントは同梱。日本語は端末のシステムフォントに任せるので、
   ネットワークが無くても表示が崩れない。 */
@font-face{
  font-family:"Chakra Petch"; font-style:normal; font-weight:500; font-display:swap;
  src:url("./fonts/chakra-petch-500-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Chakra Petch"; font-style:normal; font-weight:600; font-display:swap;
  src:url("./fonts/chakra-petch-600-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Chakra Petch"; font-style:normal; font-weight:700; font-display:swap;
  src:url("./fonts/chakra-petch-700-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
</style>

<style>
:root{
  --bg:#080B0F; --bg2:#0D131A; --surf:#141C25; --surf2:#1B2632; --surf3:#22303E;
  --line:#22303F; --line2:#31445A;
  --ink:#E9F1F7; --ink2:#98ADC0; --ink3:#61768A;
  --acc:#3DF2C0; --acc2:#0FA783; --accGlow:rgba(61,242,192,.16);
  --rose:#FF5C8A; --roseGlow:rgba(255,92,138,.16);
  --amber:#FFC53D; --violet:#8E7CFF;
  --r:14px; --rs:10px;
  --f-d:"Chakra Petch","Noto Sans JP",system-ui,sans-serif;
  --f-b:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-b); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 50% -10%, rgba(61,242,192,.05), transparent 70%);
  background-attachment:fixed;
  overscroll-behavior-y:contain;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;touch-action:manipulation}
button,a,.day,.rt,.tick,.toggle{-webkit-tap-highlight-color:rgba(61,242,192,.18)}
input,select{background:var(--surf2);border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;color:var(--ink);width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::placeholder{color:var(--ink3)}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* shell */
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:104px;position:relative;
     transition:padding-bottom .18s;
     background:linear-gradient(180deg,var(--bg2),var(--bg) 380px);
     border-inline:1px solid var(--line);}
@media(max-width:540px){.app{border-inline:none}}
.app.resting{padding-bottom:180px}

header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(8,11,15,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-d);font-weight:700;font-size:17px;letter-spacing:.14em;flex:1}
.brand i{font-style:normal;color:var(--acc)}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--surf);display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{border-color:var(--line2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sync{font-size:10px;letter-spacing:.1em;font-family:var(--f-d);color:var(--ink3);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.sync.on{color:var(--acc);border-color:rgba(61,242,192,.35);background:var(--accGlow)}

main{padding:16px 16px 8px;display:block}
.screen{display:none;animation:fade .22s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen{animation:none}}

/* nav */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(10,14,19,.93);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;
  color:var(--ink3);border-radius:10px;font-size:10.5px;letter-spacing:.04em;font-family:var(--f-d);font-weight:600}
nav.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--acc)}
nav.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(61,242,192,.5))}

/* type */
h2.st{font-family:var(--f-d);font-size:12px;letter-spacing:.18em;color:var(--ink3);
  font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h2.st:first-child{margin-top:4px}
h2.st::after{content:"";flex:1;height:1px;background:var(--line)}
.hero-date{font-family:var(--f-d);font-size:11.5px;letter-spacing:.2em;color:var(--acc);font-weight:600}
.hero-h{font-family:var(--f-d);font-size:27px;font-weight:700;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--ink2);font-size:13px;margin:6px 0 0}
.muted{color:var(--ink3)}

/* surfaces */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rows{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 11px}
.stat .k{font-size:10.5px;letter-spacing:.12em;color:var(--ink3);font-family:var(--f-d);font-weight:600}
.stat .v{font-family:var(--f-d);font-size:24px;font-weight:700;line-height:1.15;margin-top:3px}
.stat .u{font-size:12px;color:var(--ink2);font-weight:500;margin-left:2px}
.stat .d{font-size:11.5px;margin-top:2px;color:var(--ink3)}
.up{color:var(--rose)}.down{color:var(--acc)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:var(--rs);padding:11px 16px;font-family:var(--f-d);font-weight:600;
  letter-spacing:.05em;font-size:14px;border:1px solid var(--line2);color:var(--ink);background:var(--surf2)}
.btn:hover{background:var(--surf3)}
.btn.pri{background:var(--acc);color:#04140F;border-color:transparent;box-shadow:0 6px 22px -10px var(--acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.rose{background:var(--rose);color:#22060F;border-color:transparent}
.btn.ghost{background:transparent}
.btn.w{width:100%}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.4;cursor:default}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-d);font-size:11px;font-weight:600;
  letter-spacing:.08em;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2)}
.chip.acc{color:var(--acc);border-color:rgba(61,242,192,.4);background:var(--accGlow)}
.chip.amb{color:var(--amber);border-color:rgba(255,197,61,.35);background:rgba(255,197,61,.1)}
.chip.vio{color:var(--violet);border-color:rgba(142,124,255,.4);background:rgba(142,124,255,.12)}

/* routine cards */
.rt{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;width:100%;text-align:left;position:relative;overflow:hidden}
.rt:hover{border-color:var(--line2)}
.rt .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.rt .nm{font-family:var(--f-d);font-weight:700;font-size:15.5px}
.rt .mt{font-size:11.5px;color:var(--ink3);margin-top:1px}
.rt .go{margin-left:auto;color:var(--ink3)}
.rt.on{border-color:rgba(61,242,192,.45);background:linear-gradient(90deg,var(--accGlow),var(--surf) 55%)}

/* exercise / sets */
.ex{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-h{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--surf2);border-bottom:1px solid var(--line)}
.ex-h .nm{font-family:var(--f-d);font-weight:700;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-h .tg{font-family:var(--f-d);font-size:11px;color:var(--ink3);letter-spacing:.06em;white-space:nowrap}
.ex-b{padding:9px 11px 11px;display:flex;flex-direction:column;gap:7px}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:7px;align-items:center}
.setrow .n{font-family:var(--f-d);font-size:12px;color:var(--ink3);text-align:center;font-weight:600}
.setrow input{padding:8px 9px;text-align:center;font-family:var(--f-d);font-weight:600;font-size:14px}
.setrow .unit{position:relative}
.setrow .unit small{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--ink3);pointer-events:none;font-family:var(--f-d)}
.tick{width:40px;height:36px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink3);background:var(--surf2)}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.setrow.done input{border-color:rgba(61,242,192,.3);color:var(--acc);background:rgba(61,242,192,.06)}
.setrow.done .tick{background:var(--acc);border-color:transparent;color:#04140F}
.exfoot{display:flex;align-items:center;gap:8px;padding:0 11px 11px;flex-wrap:wrap}
.plate{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-family:var(--f-d);font-size:10.5px;color:var(--ink3)}
.plate .pnote{letter-spacing:.03em;margin-right:2px}
.pl{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 4px;
  border-radius:4px;font-family:var(--f-d);font-weight:700;font-size:10px;color:#0A0E13;border:1px solid rgba(0,0,0,.35)}

/* rest bar */
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:496px;z-index:45;display:none;
  background:rgba(20,28,37,.96);backdrop-filter:blur(12px);border:1px solid rgba(255,92,138,.4);
  border-radius:var(--r);padding:10px 12px;align-items:center;gap:11px;
  box-shadow:0 14px 40px -16px rgba(0,0,0,.9)}
.restbar.on{display:flex}
.restbar .lbl{font-family:var(--f-d);font-size:10.5px;letter-spacing:.16em;color:var(--rose);font-weight:600}
.restbar .t{font-family:var(--f-d);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.restbar .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--rose);border-radius:0 0 var(--r) var(--r);transition:width .2s linear}

/* timer */
.ring{display:block;margin:0 auto}
.tmwrap{position:relative;display:grid;place-items:center}
.tmover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tmphase{font-family:var(--f-d);font-size:12px;letter-spacing:.26em;font-weight:700}
.tmbig{font-family:var(--f-d);font-size:62px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tmsub{font-family:var(--f-d);font-size:12px;letter-spacing:.14em;color:var(--ink3);font-weight:600}
.rounds{display:flex;gap:5px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.rd{width:26px;height:5px;border-radius:99px;background:var(--surf3)}
.rd.done{background:var(--acc)}
.rd.cur{background:var(--amber);box-shadow:0 0 10px rgba(255,197,61,.5)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-family:var(--f-d);font-size:10.5px;color:var(--ink3);font-weight:600;padding-bottom:2px}
.cal .dow.u{color:var(--rose)}.cal .dow.s{color:#7FA9E8}
.day{aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:var(--surf);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:0}
.day.void{background:transparent}
.day .dn{font-family:var(--f-d);font-size:13px;font-weight:600;color:var(--ink2);line-height:1}
.day.today{border-color:rgba(61,242,192,.5)}
.day.today .dn{color:var(--acc)}
.day.sel{background:var(--surf3);border-color:var(--line2)}
.day .dots{display:flex;gap:3px;height:5px;align-items:center}
.day .dot{width:5px;height:5px;border-radius:99px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhead .m{font-family:var(--f-d);font-size:19px;font-weight:700;flex:1;text-align:center;letter-spacing:.04em}

/* chart */
.chartcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px;position:relative}
.chartcard .ch{display:flex;align-items:baseline;gap:9px;padding:0 2px 8px}
.chartcard .ct{font-family:var(--f-d);font-size:13px;font-weight:700;letter-spacing:.06em}
.chartcard .cv{margin-left:auto;font-family:var(--f-d);font-size:20px;font-weight:700}
.chartcard svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:rgba(11,16,22,.96);border:1px solid var(--line2);
  border-radius:9px;padding:6px 9px;font-family:var(--f-d);font-size:11.5px;font-weight:600;white-space:nowrap;
  transform:translate(-50%,-125%);opacity:0;transition:opacity .12s;z-index:5;box-shadow:0 8px 24px -10px #000}
.tip.on{opacity:1}
.tip .tv{color:var(--acc)}
.seg{display:flex;gap:4px;background:var(--surf2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{flex:1;padding:6px 4px;border-radius:99px;font-family:var(--f-d);font-size:11.5px;font-weight:600;
  color:var(--ink3);letter-spacing:.06em}
.seg button.on{background:var(--surf3);color:var(--ink)}

/* list */
.li{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--rs)}
.li .d{font-family:var(--f-d);font-size:11.5px;color:var(--ink3);font-weight:600;min-width:52px}
.li .x{margin-left:auto;color:var(--ink3);padding:4px}
.li .x:hover{color:var(--rose)}
.li svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(4,6,9,.7);backdrop-filter:blur(3px)}
.sheet.on{display:block}
.sheet .inner{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;
  max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-h .t{font-family:var(--f-d);font-size:17px;font-weight:700;flex:1}

.empty{text-align:center;padding:26px 16px;color:var(--ink3);font-size:13px;
  border:1px dashed var(--line2);border-radius:var(--r)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--f-d);font-size:10.5px;letter-spacing:.14em;color:var(--ink3);font-weight:600}
.toggle{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs)}
.toggle .tl{flex:1;font-size:13.5px}
.sw{width:44px;height:25px;border-radius:99px;background:var(--surf3);position:relative;flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:99px;background:var(--ink2);transition:transform .18s,background .18s}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(19px);background:#04140F}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.5}
.mdl{position:fixed;inset:0;z-index:80;background:rgba(4,6,9,.74);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:22px}
.mdlbox{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:18px;
  box-shadow:0 24px 60px -24px #000}
.mdlt{font-family:var(--f-d);font-weight:700;font-size:15px;line-height:1.55;margin-bottom:12px}
.mdlbtns{display:flex;gap:9px;margin-top:14px}
.mdlbtns .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:118px;z-index:90;
  background:var(--surf3);border:1px solid var(--line2);color:var(--ink);border-radius:99px;
  padding:9px 18px;font-size:13px;box-shadow:0 12px 34px -14px #000}
.del{color:var(--ink3);padding:6px;display:inline-flex;flex:none}
.del:hover{color:var(--rose)}
.del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<body>

<div class="app">
  <header class="top">
    <div class="brand">IRON<i>·</i>CADENCE</div>
    <div class="sync" id="sync">起動中</div>
    <button class="iconbtn" id="openProg" aria-label="プログラム設計">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2"/><circle cx="14" cy="18" r="2"/></svg>
    </button>
  </header>

  <main>
    <section class="screen on" id="s-today"></section>
    <section class="screen" id="s-log"></section>
    <section class="screen" id="s-timer"></section>
    <section class="screen" id="s-cal"></section>
    <section class="screen" id="s-body"></section>
  </main>

  <div class="restbar" id="restbar">
    <div style="flex:1">
      <div class="lbl">インターバル</div>
      <div class="t" id="restT">01:30</div>
    </div>
    <button class="btn sm" id="restPlus">+30秒</button>
    <button class="btn sm pri" id="restSkip">スキップ</button>
    <div class="prog" id="restProg" style="width:100%"></div>
  </div>

  <nav class="tabs" id="nav">
    <button data-t="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M9.5 19v-5h5v5"/></svg>今日</button>
    <button data-t="log"><svg viewBox="0 0 24 24"><path d="M2 12h2m16 0h2"/><rect x="4" y="8.5" width="3" height="7" rx="1"/><rect x="17" y="8.5" width="3" height="7" rx="1"/><path d="M7 12h10"/></svg>記録</button>
    <button data-t="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5"/><path d="M9.5 2.5h5"/></svg>タイマー</button>
    <button data-t="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4m8-4v4"/></svg>カレンダー</button>
    <button data-t="body"><svg viewBox="0 0 24 24"><path d="M4 18.5 9 12l3.5 3.5L20 6"/><path d="M20 10.5V6h-4.5"/></svg>ボディ</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>

<script>
(function(){
'use strict';

/* ---------------- utils ---------------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=k=>{const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
const monKey=k=>k.slice(0,7);
const today=()=>ymd(new Date());
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60);};
const nfmt=(n,d)=>{if(n==null||!isFinite(n))return '—';const v=Number(n);return v.toLocaleString('ja-JP',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
/* documents delivered by the store are frozen — always work on a copy */
const clone=o=>{ if(o==null)return o; try{return JSON.parse(JSON.stringify(o));}catch(e){return o;} };
const DOW=['日','月','火','水','木','金','土'];
const PCOL=['#3DF2C0','#8E7CFF','#FFC53D','#FF5C8A','#5AC8FA','#B4E33D'];

/* ---------------- state ---------------- */
const LS='ironcadence.v1';
const DEF_SETTINGS={rest:90,sound:true,vibe:true,bar:20};
const state={
  settings:Object.assign({},DEF_SETTINGS),
  programs:[], logs:{}, body:{}, session:null,
  tab:'today', calCur:new Date(), sel:today(), range:180, editing:null
};

function seedPrograms(){
  const mk=(n,c,ex)=>({id:uid(),name:n,color:c,ex:ex.map(e=>({n:e[0],s:e[1],r:e[2],w:e[3],rest:e[4],bar:e[5]||0}))});
  return [
    mk('プッシュ（胸・肩・三頭）',PCOL[0],[
      ['ベンチプレス',3,8,60,150,20],
      ['インクラインダンベルプレス',3,10,18,120,0],
      ['ダンベルショルダープレス',3,10,14,90,0],
      ['ケーブルフライ',3,12,15,60,0],
      ['トライセプスプレスダウン',3,12,25,60,0]]),
    mk('プル（背中・二頭）',PCOL[1],[
      ['デッドリフト',3,5,90,180,20],
      ['ラットプルダウン',3,10,50,90,0],
      ['ベントオーバーロウ',3,8,50,120,20],
      ['シーテッドロウ',3,12,45,60,0],
      ['バーベルカール',3,10,25,60,20]]),
    mk('レッグ（脚・体幹）',PCOL[2],[
      ['バックスクワット',4,6,80,180,20],
      ['ルーマニアンデッドリフト',3,10,60,120,20],
      ['レッグプレス',3,12,120,90,0],
      ['レッグカール',3,12,35,60,0],
      ['カーフレイズ',4,15,40,45,0],
      ['アブローラー',3,10,0,45,0]])
  ];
}

function lsSave(){
  try{localStorage.setItem(LS,JSON.stringify({settings:state.settings,programs:state.programs,logs:state.logs,body:state.body,session:state.session}));}catch(e){}
}
function lsLoad(){
  try{const r=localStorage.getItem(LS);if(r)return JSON.parse(r);}catch(e){}
  return null;
}

/* ---------------- persistence (this device only) ---------------- */
/* データはこの端末の localStorage だけに置く。外部への送信は一切しない。
   機種変更やデータ削除に備えて、JSON の書き出し / 読み込みでバックアップを取る。 */
let deferredRender=false;
let installPrompt=null;
function setSync(txt,on){const e=$('#sync');if(!e)return;e.textContent=txt;e.classList.toggle('on',!!on);}
/* 保存の呼び出し口は元のまま残し、中身をすべて lsSave() に寄せている */
const pushSettings=lsSave, pushProgram=lsSave, pushLogs=lsSave, pushBody=lsSave, pushSession=lsSave;

const BACKUP_TAG='ironcadence-backup';
function exportData(){
  const payload={tag:BACKUP_TAG,version:1,exportedAt:new Date().toISOString(),
    data:{settings:state.settings,programs:state.programs,logs:state.logs,body:state.body}};
  let url;
  try{
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='iron-cadence-'+today()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('バックアップを書き出しました');
  }catch(e){ toast('書き出しに失敗しました'); }
  finally{ if(url)setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(e){}},2000); }
}
function importData(file){
  const fr=new FileReader();
  fr.onerror=()=>toast('ファイルを読めませんでした');
  fr.onload=()=>{
    let p=null;
    try{ p=JSON.parse(fr.result); }catch(e){ toast('JSON として読めませんでした'); return; }
    const d=p&&typeof p==='object'&&p.data&&typeof p.data==='object'?p.data:null;
    if(!d||p.tag!==BACKUP_TAG){ toast('Iron Cadence のバックアップではありません'); return; }
    const nl=Object.keys(d.logs||{}).length, nb=Object.keys(d.body||{}).length;
    modal({title:'トレ記録 '+nl+'日分・ボディ '+nb+'件を読み込み、この端末のいまのデータを置き換えます。よろしいですか？',
      ok:'読み込む',danger:true,onOk:()=>{
        state.settings=Object.assign({},DEF_SETTINGS,d.settings||{});
        state.programs=Array.isArray(d.programs)?d.programs:[];
        state.logs=d.logs&&typeof d.logs==='object'?d.logs:{};
        state.body=d.body&&typeof d.body==='object'?d.body:{};
        state.session=null; stopRest(); lsSave(); render(); toast('読み込みました');
      }});
  };
  fr.readAsText(file);
}
function pickImportFile(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json'; inp.style.display='none';
  inp.addEventListener('change',()=>{ if(inp.files&&inp.files[0])importData(inp.files[0]); inp.remove(); });
  document.body.appendChild(inp); inp.click();
}

/* ---------------- install to home screen ---------------- */
function isStandalone(){
  try{ return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true; }
  catch(e){ return false; }
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)||
         (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
function installCardHtml(){
  if(isStandalone())
    return '<div class="card"><span class="chip acc">インストール済み</span>'+
      '<div class="hint" style="margin-top:9px">ホーム画面のアイコンから起動しています。電波が無くてもそのまま使えます。</div></div>';
  if(installPrompt)
    return '<div class="card"><div class="hint">ホーム画面に追加すると、全画面のアプリとして起動できます。</div>'+
      '<button class="btn pri w" style="margin-top:11px" data-install="1">ホーム画面に追加</button></div>';
  if(isIOS())
    return '<div class="card"><div class="hint">Safari 下部の共有ボタンから「ホーム画面に追加」を選ぶと、'+
      'アプリのように全画面で起動できます。追加後はオフラインでも動作します。</div></div>';
  return '<div class="card"><div class="hint">ブラウザのメニューから「アプリをインストール」または「ホーム画面に追加」を選ぶと、'+
    'アプリのように全画面で起動できます。追加後はオフラインでも動作します。</div></div>';
}
function doInstall(){
  const p=installPrompt; if(!p)return;
  installPrompt=null;
  try{ p.prompt(); p.userChoice.then(()=>{ if(state.tab==='timer')renderTimer(); }).catch(()=>{}); }
  catch(e){ toast('この環境では自動追加できません'); }
}
window.addEventListener('beforeinstallprompt',ev=>{
  ev.preventDefault(); installPrompt=ev;
  if(state.tab==='timer')renderTimer();
});
window.addEventListener('appinstalled',()=>{
  installPrompt=null; toast('ホーム画面に追加しました');
  if(state.tab==='timer')renderTimer();
});

/* ---------------- audio & haptics ---------------- */
let AC=null;
function ac(){
  try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){}
  return AC;
}
function beep(freq,dur,vol,type,delay){
  if(!state.settings.sound)return;
  const c=ac(); if(!c)return;
  try{
    const t0=c.currentTime+(delay||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'triangle'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.3,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function buzz(ms){ if(!state.settings.vibe)return; try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){} }
const cueTick =()=>{beep(880,.09,.22,'square');buzz(20);};
const cueGo   =()=>{beep(1180,.13,.32,'square');beep(1570,.22,.3,'square',.14);buzz([40,50,90]);};
const cueRest =()=>{beep(560,.28,.28,'sine');buzz(60);};
const cueDone =()=>{beep(880,.14,.3,'triangle');beep(1170,.14,.3,'triangle',.15);beep(1560,.34,.32,'triangle',.3);buzz([70,60,70,60,160]);};

let wl=null;
async function keepAwake(on){
  try{
    if(on&&!wl&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen');
    if(!on&&wl){wl.release();wl=null;}
  }catch(e){}
}

/* ---------------- timers ---------------- */
const rest={on:false,end:0,total:0,last:-1};
function startRest(sec){
  sec=Math.max(5,sec|0);
  rest.on=true;rest.total=sec;rest.end=Date.now()+sec*1000;rest.last=-1;
  $('#restbar').classList.add('on'); $('.app').classList.add('resting');
  keepAwake(true); paintRest();
}
function stopRest(){
  rest.on=false;
  $('#restbar').classList.remove('on'); $('.app').classList.remove('resting');
  if(!tb.on)keepAwake(false);
}
function paintRest(){
  const left=(rest.end-Date.now())/1000;
  $('#restT').textContent=mmss(left);
  $('#restProg').style.width=clamp(left/rest.total*100,0,100)+'%';
}

const TABATA={work:20,restS:10,rounds:8,prep:10};
const tb={on:false,paused:false,idx:0,end:0,left:0,seq:[],last:-1};
function buildSeq(){
  const s=[{p:'prep',d:TABATA.prep,r:0}];
  for(let i=1;i<=TABATA.rounds;i++){s.push({p:'work',d:TABATA.work,r:i});if(i<TABATA.rounds)s.push({p:'rest',d:TABATA.restS,r:i});}
  return s;
}
function tbStart(){
  ac();
  if(!tb.seq.length||tb.idx>=tb.seq.length){tb.seq=buildSeq();tb.idx=0;}
  tb.on=true;tb.paused=false;tb.last=-1;
  tb.end=Date.now()+(tb.left>0?tb.left:tb.seq[tb.idx].d)*1000;tb.left=0;
  keepAwake(true);paintTimer();
}
function tbPause(){ if(!tb.on)return; tb.paused=true;tb.on=false;tb.left=(tb.end-Date.now())/1000;keepAwake(false);paintTimer(); }
function tbReset(){ tb.on=false;tb.paused=false;tb.idx=0;tb.left=0;tb.seq=buildSeq();keepAwake(false);paintTimer(); }

setInterval(()=>{
  const now=Date.now();
  if(rest.on){
    const left=(rest.end-now)/1000, s=Math.ceil(left);
    if(s!==rest.last){ rest.last=s; if(s<=3&&s>0)cueTick(); }
    if(left<=0){cueDone();stopRest();}else paintRest();
  }
  if(tb.on){
    const cur=tb.seq[tb.idx];
    const left=(tb.end-now)/1000, s=Math.ceil(left);
    if(s!==tb.last){ tb.last=s; if(s<=3&&s>0&&cur.p!=='work')cueTick(); }
    if(left<=0){
      tb.idx++;
      if(tb.idx>=tb.seq.length){ tb.on=false;tb.left=0;cueDone();keepAwake(false);paintTimer();return; }
      const nx=tb.seq[tb.idx];
      tb.end=now+nx.d*1000; tb.last=-1;
      if(nx.p==='work')cueGo(); else cueRest();
    }
    if(state.tab==='timer')paintTimer();
  }
},100);

/* ---------------- derived ---------------- */
function volOf(day){ let v=0; (day.ex||[]).forEach(e=>(e.sets||[]).forEach(s=>{v+=(+s.w||0)*(+s.r||0);})); return v; }
function e1rm(w,r){ w=+w||0;r=+r||0; if(!w||!r)return 0; return w*(1+r/30); }
function plateSplit(total,bar){
  const P=[25,20,15,10,5,2.5,1.25];
  let side=(total-bar)/2; if(side<0)return null;
  const out=[];
  for(const p of P){ let n=0; while(side>=p-1e-9){side-=p;n++;} if(n)out.push([p,n]); }
  return {out,rem:Math.round(side*100)/100};
}
const PLC={25:'#E5352B',20:'#2F5FE0',15:'#F2C400',10:'#1F9E4F',5:'#DCE3E8',2.5:'#B23A32',1.25:'#9AA6B2'};
function streak(){
  let n=0; const d=new Date();
  if(!state.logs[ymd(d)])d.setDate(d.getDate()-1);
  for(;;){ if(state.logs[ymd(d)]){n++;d.setDate(d.getDate()-1);}else break; }
  return n;
}
function lastNDays(n){
  const out=[],d=new Date();
  for(let i=0;i<n;i++){ out.push(ymd(d)); d.setDate(d.getDate()-1); }
  return out;
}
function bodySorted(){
  return Object.keys(state.body).sort().map(k=>({k,t:parseYmd(k).getTime(),w:+state.body[k].w||null,f:state.body[k].f==null?null:+state.body[k].f}));
}

/* ---------------- icons ---------------- */
const I={
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.5 19 12 7 19.5z" fill="currentColor" stroke="none"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><path d="M9 5l7 7-7 7"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9L17.5 7"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  rot:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>'
};

/* ---------------- render: TODAY ---------------- */
function renderToday(){
  const d=new Date();
  const wk=lastNDays(7);
  const days=wk.filter(k=>state.logs[k]).length;
  const vol=wk.reduce((a,k)=>a+(state.logs[k]?volOf(state.logs[k]):0),0);
  const sets=wk.reduce((a,k)=>a+(state.logs[k]?(state.logs[k].ex||[]).reduce((b,e)=>b+(e.sets||[]).length,0):0),0);
  const bk=Object.keys(state.body).sort();
  const last=bk.length?state.body[bk[bk.length-1]]:null;
  const prev=bk.length>1?state.body[bk[bk.length-2]]:null;
  const lbm=last&&last.w&&last.f!=null?last.w*(1-last.f/100):null;

  let h='';
  h+='<div class="hero-date">'+d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+DOW[d.getDay()]+'曜日</div>';
  h+='<h1 class="hero-h">'+(state.session?'セッション進行中':(state.logs[today()]?'今日のトレーニングは完了':'今日のメニューを選ぶ'))+'</h1>';

  if(state.session){
    const el=Math.round((Date.now()-state.session.start)/60000);
    const dn=state.session.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    const tt=state.session.ex.reduce((a,e)=>a+e.sets.length,0);
    h+='<div class="card" style="margin-top:14px;border-color:rgba(61,242,192,.4);background:linear-gradient(160deg,rgba(61,242,192,.1),var(--surf) 60%)">';
    h+='<div style="display:flex;align-items:center;gap:10px"><span class="chip acc">継続中</span><span class="muted" style="font-size:12px">経過 '+el+'分</span></div>';
    h+='<div style="font-family:var(--f-d);font-weight:700;font-size:18px;margin-top:8px">'+esc(state.session.rname)+'</div>';
    h+='<div class="sub">'+dn+' / '+tt+' セット完了</div>';
    h+='<button class="btn pri w" style="margin-top:12px" data-go="log">記録を続ける '+I.chev+'</button></div>';
  }else if(state.logs[today()]){
    const lg=state.logs[today()];
    h+='<div class="card" style="margin-top:14px">';
    h+='<div style="display:flex;align-items:center;gap:9px"><span class="chip acc">完了</span><span style="font-family:var(--f-d);font-weight:700">'+esc(lg.name)+'</span></div>';
    h+='<div class="grid3" style="margin-top:12px">'+
       tile('ボリューム',nfmt(volOf(lg)),'kg')+tile('セット',(lg.ex||[]).reduce((a,e)=>a+(e.sets||[]).length,0),'')+tile('時間',Math.round((lg.sec||0)/60),'分')+'</div>';
    h+='<button class="btn w ghost" style="margin-top:12px" data-go="log">もう一度トレーニングする</button></div>';
  }else{
    h+='<div class="rows" style="margin-top:14px">';
    state.programs.forEach(p=>{
      const n=p.ex.length, ts=p.ex.reduce((a,e)=>a+(+e.s||0),0);
      h+='<button class="rt" data-start="'+p.id+'"><span class="bar" style="background:'+p.color+'"></span>'+
         '<span style="flex:1;min-width:0"><span class="nm" style="display:block">'+esc(p.name)+'</span>'+
         '<span class="mt">'+n+'種目 · '+ts+'セット · 目安'+Math.round(p.ex.reduce((a,e)=>a+(+e.s||0)*((+e.rest||60)+40),0)/60)+'分</span></span>'+
         '<span class="go">'+I.chev+'</span></button>';
    });
    if(!state.programs.length)h+='<div class="empty">プログラムがありません。右上のメニューから作成できます。</div>';
    h+='<button class="btn ghost w" data-start="_empty">空のセッションを開始</button></div>';
  }

  h+='<h2 class="st">直近7日</h2>';
  h+='<div class="grid3">'+tile('トレ日数',days,'日')+tile('ボリューム',vol>=1000?nfmt(vol/1000,1):nfmt(vol),vol>=1000?'t':'kg')+tile('連続',streak(),'日')+'</div>';
  h+='<div class="card" style="margin-top:10px;padding:12px 14px"><div style="display:flex;align-items:center;gap:8px">'+
     '<span class="k" style="font-family:var(--f-d);font-size:10.5px;letter-spacing:.12em;color:var(--ink3);font-weight:600">総セット数</span>'+
     '<span class="num" style="margin-left:auto;font-size:16px;font-weight:700">'+sets+'</span></div>'+
     weekBars()+'</div>';

  h+='<h2 class="st">ボディ</h2>';
  if(last){
    const dw=prev&&prev.w?last.w-prev.w:null;
    h+='<div class="grid3">'+
      tile('体重',nfmt(last.w,1),'kg',dw==null?'':(dw>0?'+':'')+nfmt(dw,1)+'kg',dw>0?'up':'down')+
      tile('体脂肪',last.f==null?'—':nfmt(last.f,1),'%')+
      tile('除脂肪',lbm?nfmt(lbm,1):'—','kg')+'</div>';
    h+='<button class="btn ghost w" style="margin-top:10px" data-go="body">グラフを見る '+I.chev+'</button>';
  }else{
    h+='<div class="empty">体重・体脂肪はまだ未記録です。<br><span style="color:var(--acc)">ボディ</span>タブから記録を始められます。</div>';
  }

  const recent=Object.keys(state.logs).sort().reverse().slice(0,3);
  if(recent.length){
    h+='<h2 class="st">最近の記録</h2><div class="rows">';

function platesHtml(total,bar){

function ringSvg(){

    '<circle cx="116" cy="116" r="'+r+'" fill="none" stroke="#22303E" stroke-width="9"/>'+

    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 116 116)"/></svg>';

function paintTimer(){
  const arc=$('#tmArc'); if(!arc)return;
  const cur=tb.seq.length?tb.seq[Math.min(tb.idx,tb.seq.length-1)]:{p:'prep',d:TABATA.prep,r:0};
  let left, frac;
  if(tb.on){ left=(tb.end-Date.now())/1000; }
  else if(tb.paused){ left=tb.left; }
  else { left=tb.seq.length&&tb.idx>=tb.seq.length?0:cur.d; }
  left=Math.max(0,left); frac=cur.d?left/cur.d:0;
  const fin=tb.seq.length&&tb.idx>=tb.seq.length&&!tb.on;
  const col=fin?'#3DF2C0':cur.p==='work'?'#3DF2C0':cur.p==='rest'?'#FF5C8A':'#FFC53D';
  const lbl=fin?'FINISH':cur.p==='work'?'WORK':cur.p==='rest'?'REST':'READY';
  const c=2*Math.PI*98;
  arc.setAttribute('stroke',col);
  arc.setAttribute('stroke-dashoffset',(c*(1-frac)).toFixed(1));
  const ph=$('#tmPhase'); ph.textContent=lbl; ph.style.color=col;
  $('#tmBig').textContent=mmss(Math.ceil(left));
  $('#tmBig').style.color=fin?col:'var(--ink)';
  $('#tmSub').textContent='ROUND '+(fin?TABATA.rounds:cur.r)+' / '+TABATA.rounds;
  let rh='';
  for(let i=1;i<=TABATA.rounds;i++){
    const done=fin||cur.r>i||(cur.r===i&&cur.p==='rest');
    rh+='<div class="rd'+(done?' done':(cur.r===i&&cur.p==='work'&&(tb.on||tb.paused)?' cur':''))+'"></div>';
  }
  const rd=$('#tmRounds'); if(rd)rd.innerHTML=rh;
  const tg=$('#tmToggle'); if(tg)tg.innerHTML=tb.on?I.pause+'一時停止':(I.play+(tb.paused?'再開':(fin?'もう一度':'スタート')));
}

function demoSeries(base,slope,noise,dec){
  const out=[],n=60,now=Date.now();
  let seed=7;
  const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
  for(let i=n;i>=0;i--){
    const t=now-i*86400000;
    out.push({t,v:+(base+slope*(n-i)+(rnd()-0.5)*noise*2).toFixed(dec),k:ymd(new Date(t))});
  }
  return out;
}

/* ---------------- chart ---------------- */
function drawChart(el,data,o){
  if(!el)return;
  const demo=!data||data.length===0;
  const pts=demo?o.demo:data;
  const single=pts.length===1;
  const W=Math.max(240,el.clientWidth-24), H=138;
  const mL=36,mR=10,mT=10,mB=20;
  const iw=W-mL-mR, ih=H-mT-mB;
  let vmin=Infinity,vmax=-Infinity,tmin=Infinity,tmax=-Infinity;
  pts.forEach(p=>{vmin=Math.min(vmin,p.v);vmax=Math.max(vmax,p.v);tmin=Math.min(tmin,p.t);tmax=Math.max(tmax,p.t);});
  let span=vmax-vmin; if(span<0.6)span=0.6;
  vmin-=span*0.18; vmax+=span*0.18;
  const step=niceStep((vmax-vmin)/3);
  vmin=Math.floor(vmin/step)*step; vmax=Math.ceil(vmax/step)*step;
  if(tmax===tmin){tmin-=5*86400000;tmax+=5*86400000;}
  const X=t=>mL+(t-tmin)/(tmax-tmin)*iw;
  const Y=v=>mT+(1-(v-vmin)/(vmax-vmin))*ih;
  const col=demo?'#4A5C6E':o.color;

  let grid='',lab='';
  for(let v=vmin;v<=vmax+1e-9;v+=step){
    const y=Y(v);
    grid+='<line x1="'+mL+'" y1="'+y.toFixed(1)+'" x2="'+(W-mR)+'" y2="'+y.toFixed(1)+'" stroke="#1E2A36" stroke-width="1"/>';
    lab+='<text x="'+(mL-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" fill="#61768A" font-size="9.5" font-family="Chakra Petch, sans-serif">'+(+v.toFixed(2))+'</text>';
  }
  let xl='';
  const nx=3;
  for(let i=0;i<=nx;i++){
    const t=tmin+(tmax-tmin)*i/nx, d=new Date(t);
    const anch=i===0?'start':i===nx?'end':'middle';
    xl+='<text x="'+X(t).toFixed(1)+'" y="'+(H-5)+'" text-anchor="'+anch+'" fill="#61768A" font-size="9.5" font-family="Chakra Petch, sans-serif">'+(d.getMonth()+1)+'/'+d.getDate()+'</text>';
  }
  let line='',area='';
  pts.forEach((p,i)=>{ const x=X(p.t).toFixed(1),y=Y(p.v).toFixed(1); line+=(i?'L':'M')+x+' '+y+' '; });
  area='M'+X(pts[0].t).toFixed(1)+' '+(mT+ih)+' L'+line.slice(1)+'L'+X(pts[pts.length-1].t).toFixed(1)+' '+(mT+ih)+' Z';
  const gid='g'+Math.random().toString(36).slice(2,7);
  const lastP=pts[pts.length-1];

  const svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+o.title+'の推移">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity="'+(demo?.12:.26)+'"/>'+
    '<stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+lab+xl+
    (single?'':'<path d="'+area+'" fill="url(#'+gid+')" stroke="none"/>'+
    '<path d="'+line.trim()+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(demo?' stroke-dasharray="4 4"':'')+'/>')+
    '<circle cx="'+X(lastP.t).toFixed(1)+'" cy="'+Y(lastP.v).toFixed(1)+'" r="4.5" fill="'+col+'" stroke="#141C25" stroke-width="2.5"/>'+
    '<line id="cx" x1="0" y1="'+mT+'" x2="0" y2="'+(mT+ih)+'" stroke="'+col+'" stroke-width="1" opacity="0"/>'+
    '<rect x="'+mL+'" y="'+mT+'" width="'+iw+'" height="'+ih+'" fill="transparent" style="cursor:crosshair"/></svg>';

  el.innerHTML='<div class="ch"><span class="ct">'+o.title+'</span>'+
    (demo?'<span class="chip" style="font-size:9.5px;padding:2px 7px">サンプル表示</span>':
      single?'<span class="chip" style="font-size:9.5px;padding:2px 7px">記録1件</span>':'')+
    '<span class="cv" style="color:'+col+'">'+nfmt(lastP.v,o.dec)+'<span class="u" style="font-size:12px;color:var(--ink2)"> '+o.unit+'</span></span></div>'+
    svg+'<div class="tip"></div>';

  const svgEl=el.querySelector('svg'), tip=el.querySelector('.tip'), cx=el.querySelector('#cx');
  const rectHit=el.querySelector('rect[fill="transparent"]');
  function move(ev){
    const r=svgEl.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W;
    let best=pts[0],bd=1e12;
    pts.forEach(p=>{const d=Math.abs(X(p.t)-px);if(d<bd){bd=d;best=p;}});
    const bx=X(best.t),by=Y(best.v);
    cx.setAttribute('x1',bx);cx.setAttribute('x2',bx);cx.setAttribute('opacity','.5');
    tip.classList.add('on');
    tip.innerHTML=(best.k?best.k.slice(5).replace('-','/'):'')+' <span class="tv" style="color:'+col+'">'+nfmt(best.v,o.dec)+o.unit+'</span>';
    tip.style.left=(bx/W*r.width+12)+'px';
    tip.style.top=(by/H*r.height+34)+'px';
  }
  if(rectHit){
    rectHit.addEventListener('pointermove',move);
    rectHit.addEventListener('pointerdown',move);
    rectHit.addEventListener('pointerleave',()=>{tip.classList.remove('on');cx.setAttribute('opacity','0');});
  }
}
function niceStep(x){
  if(!isFinite(x)||x<=0)return 1;
  const e=Math.pow(10,Math.floor(Math.log10(x))), f=x/e;
  return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e;
}

/* ---------------- in-page dialogs (sandbox blocks prompt/confirm) ---------------- */
function modal(o){
  const wrap=document.createElement('div');
  wrap.className='mdl';
  wrap.innerHTML='<div class="mdlbox"><div class="mdlt">'+esc(o.title)+'</div>'+
    (o.input?'<input class="mdlin" inputmode="text" value="'+esc(o.def||'')+'" placeholder="'+esc(o.ph||'')+'">':'')+
    '<div class="mdlbtns"><button class="btn ghost" data-mc="0">'+esc(o.cancel||'キャンセル')+'</button>'+
    '<button class="btn '+(o.danger?'rose':'pri')+'" data-mc="1">'+esc(o.ok||'OK')+'</button></div></div>';
  document.body.appendChild(wrap);
  const inp=wrap.querySelector('.mdlin');
  function done(go){
    const v=inp?inp.value.trim():true;
    wrap.remove();
    if(go&&o.onOk)o.onOk(v);
  }
  wrap.addEventListener('click',ev=>{
    if(ev.target===wrap){wrap.remove();return;}
    const b=ev.target.closest('[data-mc]'); if(!b)return;
    ev.stopPropagation(); done(b.dataset.mc==='1');
  });
  if(inp){
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')done(true);});
    setTimeout(()=>{try{inp.focus();inp.select();}catch(e){}},60);
  }
}
function toast(m){
  const d=document.createElement('div'); d.className='toast'; d.textContent=m;
  document.body.appendChild(d); setTimeout(()=>{try{d.remove();}catch(e){}},2200);
}

/* ---------------- program sheet ---------------- */
function openSheet(html){ $('#sheetInner').innerHTML='<div class="grab"></div>'+html; $('#sheet').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); state.editing=null; }

function renderProgramList(){
  let h='<div class="sh-h"><div class="t">プログラム設計</div><button class="iconbtn" data-close="1">'+I.x+'</button></div>';
  h+='<p class="hint" style="margin:0 0 14px">分割メニューを作って、記録画面からワンタップで開始できます。</p><div class="rows">';
  state.programs.forEach(p=>{
    h+='<button class="rt" data-edit="'+p.id+'"><span class="bar" style="background:'+p.color+'"></span>'+
       '<span style="flex:1;min-width:0"><span class="nm" style="display:block">'+esc(p.name)+'</span>'+
       '<span class="mt">'+p.ex.length+'種目 · '+p.ex.reduce((a,e)=>a+(+e.s||0),0)+'セット</span></span>'+
       '<span class="go">'+I.chev+'</span></button>';
  });
  h+='<button class="btn pri w" data-newprog="1">'+I.plus+'新しいメニューを作る</button>';
  h+='<button class="btn ghost w" data-reseed="1">初期メニューを追加</button></div>';
  openSheet(h);
}
function renderProgramEdit(id){
  const p=state.programs.find(x=>x.id===id); if(!p)return renderProgramList();
  state.editing=id;
  let h='<div class="sh-h"><button class="iconbtn" data-plist="1">'+I.left+'</button><div class="t">メニューを編集</div>'+
        '<button class="iconbtn" data-close="1">'+I.x+'</button></div>';
  h+='<div class="field"><label>メニュー名</label><input id="pn" value="'+esc(p.name)+'"></div>';
  h+='<div class="field" style="margin-top:10px"><label>カラー</label><div style="display:flex;gap:8px">'+
     PCOL.map(c=>'<button data-pc="'+c+'" style="flex:1;height:32px;border-radius:9px;background:'+c+';border:2px solid '+(p.color===c?'#E9F1F7':'transparent')+'"></button>').join('')+'</div></div>';
  h+='<h2 class="st">種目</h2><div class="rows">';
  p.ex.forEach((e,i)=>{
    h+='<div class="card" style="padding:11px 12px">'+
      '<div style="display:flex;gap:8px;align-items:center">'+
      '<input data-pe="n" data-i="'+i+'" value="'+esc(e.n)+'" style="font-family:var(--f-d);font-weight:600">'+
      '<button class="del" data-pdel="'+i+'">'+I.trash+'</button></div>'+
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px">'+
      pf('セット',e.s,'s',i)+pf('回数',e.r,'r',i)+pf('kg',e.w,'w',i)+pf('休憩秒',e.rest,'rest',i)+
      '</div>'+
      '<button class="btn sm '+(e.bar?'pri':'ghost')+'" data-pbar="'+i+'" style="margin-top:8px">バーベル種目'+(e.bar?'：ON':'：OFF')+'</button>'+
      '</div>';
  });
  h+='<button class="btn ghost w" data-pnew="1">'+I.plus+'種目を追加</button></div>';
  h+='<div style="display:flex;gap:9px;margin-top:16px">'+
     '<button class="btn rose" data-progdel="'+p.id+'" style="flex:none;width:52px;padding:11px 0">'+I.trash+'</button>'+
     '<button class="btn pri" data-psave="1" style="flex:1">保存する</button></div>';
  openSheet(h);
}
function pf(l,v,k,i){
  return '<div class="field"><label style="font-size:9.5px">'+l+'</label>'+
    '<input inputmode="decimal" data-pe="'+k+'" data-i="'+i+'" value="'+(v==null?'':v)+'" style="text-align:center;padding:8px 4px;font-family:var(--f-d);font-weight:600"></div>';
}
function renderSummary(day,key){
  const sets=(day.ex||[]).reduce((a,e)=>a+(e.sets||[]).length,0);
  let h='<div class="sh-h"><div class="t">セッション完了</div><button class="iconbtn" data-close="1">'+I.x+'</button></div>';
  h+='<div class="card" style="border-color:rgba(61,242,192,.4);background:linear-gradient(160deg,rgba(61,242,192,.1),var(--surf) 60%)">'+
     '<span class="chip acc">'+esc(day.name)+'</span>'+
     '<div class="grid3" style="margin-top:12px">'+tile('ボリューム',nfmt(volOf(day)),'kg')+tile('セット',sets,'')+tile('時間',Math.round((day.sec||0)/60),'分')+'</div></div>';
  h+='<div class="rows" style="margin-top:12px">';
  (day.ex||[]).forEach(e=>{
    const best=(e.sets||[]).reduce((a,s)=>Math.max(a,e1rm(s.w,s.r)),0);
    h+='<div class="li"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px">'+esc(e.n)+'</span>'+
       '<span class="num muted" style="font-size:12px">'+(e.sets||[]).length+'セット</span>'+
       (best?'<span class="num" style="font-size:12.5px;color:var(--amber)">1RM '+nfmt(best,1)+'</span>':'')+'</div>';
  });
  h+='</div><button class="btn pri w" style="margin-top:16px" data-close="1">閉じる</button>';
  openSheet(h);
}

/* ---------------- session ops ---------------- */
function startSession(pid){
  const p=pid==='_empty'?null:state.programs.find(x=>x.id===pid);
  state.session={
    start:Date.now(), rid:p?p.id:null, rname:p?p.name:'フリーセッション', color:p?p.color:'#3DF2C0',
    ex:(p?p.ex:[]).map(e=>({n:e.n,tS:+e.s||3,tR:+e.r||10,rest:+e.rest||state.settings.rest,bar:e.bar?state.settings.bar:0,
      sets:Array.from({length:Math.max(1,+e.s||3)},()=>({w:e.w||'',r:e.r||'',done:false}))}))
  };
  if(!state.session.ex.length)addExercise(true);
  pushSession(); go('log');
}
function addExercise(silent){
  if(silent){
    state.session.ex.push(newEx('新しい種目'));
    pushSession(); return;
  }
  modal({title:'追加する種目名',input:true,ph:'例：ベンチプレス',ok:'追加',onOk:v=>{
    state.session.ex.push(newEx(v||'新しい種目'));
    pushSession(); renderLog();
  }});
}
function newEx(name){
  return {n:name,tS:3,tR:10,rest:state.settings.rest,bar:0,
    sets:[{w:'',r:'',done:false},{w:'',r:'',done:false},{w:'',r:'',done:false}]};
}
function finishSession(){
  const s=state.session; if(!s)return;
  const ex=s.ex.map(e=>({n:e.n,sets:e.sets.filter(x=>x.done).map(x=>({w:+x.w||0,r:+x.r||0}))})).filter(e=>e.sets.length);
  if(!ex.length){
    modal({title:'完了したセットがありません。記録せずに終了しますか？',ok:'終了する',danger:true,onOk:()=>{
      state.session=null;pushSession();stopRest();render();
    }});
    return;
  }
  const key=today();
  const day={name:s.rname,color:s.color,ex,sec:Math.round((Date.now()-s.start)/1000)};
  state.logs[key]=day;
  state.session=null;
  state.sel=key;
  stopRest();
  pushLogs(key); pushSession(); render();
  renderSummary(day,key);
}

/* ---------------- nav & render ---------------- */
function go(t){
  state.tab=t;
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $$('.screen').forEach(s=>s.classList.remove('on'));
  const sc=$('#s-'+t); if(sc)sc.classList.add('on');
  render();
  try{window.scrollTo(0,0);}catch(e){}
}
function render(){
  try{
    if(state.tab==='today')renderToday();
    else if(state.tab==='log')renderLog();
    else if(state.tab==='timer')renderTimer();
    else if(state.tab==='cal')renderCal();
    else if(state.tab==='body')renderBody();
  }catch(e){ console.error(e); toast('表示エラー: '+(e&&e.message||e)); }
}

/* ---------------- events ---------------- */
document.addEventListener('click',ev=>{ try{ onTap(ev); }catch(e){ console.error(e); toast('エラー: '+(e&&e.message||e)); } });
function onTap(ev){
  const t=ev.target.closest('[data-t],[data-go],[data-start],[data-done],[data-addset],[data-addex],[data-exdel],[data-fin],'+
    '[data-mv],[data-day],[data-logdel],[data-range],[data-bdel],[data-rest],[data-tg],[data-bar],[data-close],[data-edit],'+
    '[data-newprog],[data-reseed],[data-plist],[data-pc],[data-pdel],[data-pnew],[data-pbar],[data-psave],[data-progdel],[data-bsave],'+
    '[data-export],[data-import],[data-install]');
  if(!t)return;
  const d=t.dataset;
  ac();
  if(d.t){go(d.t);return;}
  if(d.go){go(d.go);return;}
  if(d.start){startSession(d.start);return;}
  if(d.done){
    const [ei,si]=d.done.split('.').map(Number);
    const st=state.session.ex[ei].sets[si];
    st.done=!st.done;
    if(st.done){
      const row=t.closest('.setrow');
      const wv=row.querySelector('[data-in="w"]').value, rv=row.querySelector('[data-in="r"]').value;
      st.w=wv===''?0:+wv; st.r=rv===''?0:+rv;
      startRest(state.session.ex[ei].rest||state.settings.rest);
    }
    pushSession(); renderLog(); return;
  }
  if(d.addset){
    const e=state.session.ex[+d.addset], lastS=e.sets[e.sets.length-1];
    e.sets.push({w:lastS?lastS.w:'',r:lastS?lastS.r:'',done:false});
    pushSession(); renderLog(); return;
  }
  if(d.addex){addExercise();return;}
  if(d.exdel){ const i=+d.exdel, nm=state.session.ex[i]?state.session.ex[i].n:'';
    modal({title:'「'+nm+'」を削除しますか？',ok:'削除',danger:true,onOk:()=>{state.session.ex.splice(i,1);pushSession();renderLog();}}); return; }
  if(d.fin){finishSession();return;}
  if(d.mv){state.calCur=new Date(state.calCur.getFullYear(),state.calCur.getMonth()+ +d.mv,1);renderCal();return;}
  if(d.day){state.sel=d.day;renderCal();return;}
  if(d.logdel){ const k=d.logdel;
    modal({title:'この日の記録を削除しますか？',ok:'削除',danger:true,onOk:()=>{delete state.logs[k];pushLogs(k);renderCal();}}); return; }
  if(d.range){state.range=+d.range;renderBody();return;}
  if(d.bdel){ delete state.body[d.bdel]; pushBody(d.bdel); renderBody(); return; }
  if(d.rest){state.settings.rest=+d.rest;pushSettings();renderTimer();return;}
  if(d.tg){state.settings[d.tg]=!state.settings[d.tg];pushSettings();renderTimer();if(state.settings.sound)beep(1000,.1,.25);return;}
  if(d.bar){state.settings.bar=+d.bar;pushSettings();renderTimer();return;}
  if(d.close){closeSheet();return;}
  if(d.edit){renderProgramEdit(d.edit);return;}
  if(d.plist){saveEdit();renderProgramList();return;}
  if(d.newprog){
    const p={id:uid(),name:'新しいメニュー',color:PCOL[state.programs.length%PCOL.length],
      ex:[{n:'種目 1',s:3,r:10,w:20,rest:state.settings.rest,bar:0}]};
    state.programs.push(p); pushProgram(p); renderProgramEdit(p.id); return;
  }
  if(d.reseed){ seedPrograms().forEach(p=>{state.programs.push(p);pushProgram(p);}); renderProgramList(); render(); return; }
  if(d.pc){ const p=state.programs.find(x=>x.id===state.editing); if(p){p.color=d.pc;renderProgramEdit(p.id);} return; }
  if(d.pdel){ const p=state.programs.find(x=>x.id===state.editing); saveEdit(); p.ex.splice(+d.pdel,1); pushProgram(p); renderProgramEdit(p.id); return; }
  if(d.pnew){ const p=state.programs.find(x=>x.id===state.editing); saveEdit();
    p.ex.push({n:'種目 '+(p.ex.length+1),s:3,r:10,w:20,rest:state.settings.rest,bar:0}); pushProgram(p); renderProgramEdit(p.id); return; }
  if(d.pbar){ const p=state.programs.find(x=>x.id===state.editing); saveEdit(); p.ex[+d.pbar].bar=p.ex[+d.pbar].bar?0:1; pushProgram(p); renderProgramEdit(p.id); return; }
  if(d.psave){ saveEdit(); renderProgramList(); render(); return; }
  if(d.progdel){ const id=d.progdel;
    modal({title:'このメニューを削除しますか？',ok:'削除',danger:true,onOk:()=>{
      state.programs=state.programs.filter(x=>x.id!==id);
      lsSave();
      renderProgramList(); render();
    }}); return; }
  if(d.bsave){ saveBody(); return; }
  if(d.export){ exportData(); return; }
  if(d.import){ pickImportFile(); return; }
  if(d.install){ doInstall(); return; }
}

function saveEdit(){
  const p=state.programs.find(x=>x.id===state.editing); if(!p)return;
  const nm=$('#pn'); if(nm)p.name=nm.value.trim()||p.name;
  $$('#sheetInner [data-pe]').forEach(inp=>{
    const i=+inp.dataset.i, k=inp.dataset.pe; if(!p.ex[i])return;
    p.ex[i][k]= k==='n' ? (inp.value.trim()||p.ex[i].n) : (inp.value===''?0:+inp.value);
  });
  pushProgram(p);
}
function saveBody(){
  const w=$('#bw').value.trim(), f=$('#bf').value.trim(), k=$('#bd').value||today();
  if(w===''&&f===''){ toast('体重か体脂肪率を入力してください'); return; }
  const prevE=state.body[k]||{};
  state.body[k]={w:w===''?(prevE.w||null):+w, f:f===''?(prevE.f==null?null:prevE.f):+f};
  pushBody(k); renderBody(); toast('記録しました');
  beep(1046,.1,.24); beep(1568,.16,.24,'triangle',.1);
}

document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.in&&state.session){
    const e=state.session.ex[+el.dataset.e], s=e&&e.sets[+el.dataset.s];
    if(s){ s[el.dataset.in]=el.value===''?'':+el.value; lsSave(); pushSession(); }
  }
});
document.addEventListener('focusout',()=>{
  if(deferredRender){deferredRender=false;setTimeout(()=>{if(!/^(INPUT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName||''))render();},150);}
});

$('#openProg').addEventListener('click',()=>{ac();renderProgramList();});
$('#sheet').addEventListener('click',ev=>{ if(ev.target.id==='sheet'){saveEdit();closeSheet();} });
$('#restSkip').addEventListener('click',()=>{stopRest();});
$('#restPlus').addEventListener('click',()=>{rest.end+=30000;rest.total+=30;paintRest();});

document.addEventListener('click',ev=>{
  const b=ev.target.closest('#tmToggle,#tmReset'); if(!b)return;
  if(b.id==='tmToggle'){ if(tb.on)tbPause(); else tbStart(); }
  else tbReset();
});

let ro;
window.addEventListener('resize',()=>{clearTimeout(ro);ro=setTimeout(()=>{if(state.tab==='body')renderBody();},220);});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ if(state.tab==='timer')paintTimer(); if(rest.on)paintRest(); } });

/* ---------------- boot ---------------- */
(function boot(){
  const l=lsLoad();
  if(l){
    state.settings=Object.assign({},DEF_SETTINGS,l.settings||{});
    state.programs=l.programs&&l.programs.length?l.programs:seedPrograms();
    state.logs=l.logs||{}; state.body=l.body||{}; state.session=l.session||null;
  }else{
    state.programs=seedPrograms();
    lsSave();
  }
  tb.seq=buildSeq();
  render();
  setSync('端末内保存',false);
  setInterval(()=>{ if(state.tab==='today'||state.tab==='log'){ if(state.session&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName||''))render(); } },30000);
})();

/* ---------------- service worker (offline) ---------------- */
/* 一度開けば、以降は電波が無くても起動できる。 */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadController=!!navigator.serviceWorker.controller;
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    /* 記録中に勝手に再読み込みはしない。次回の起動で新しい版になる。 */
    if(hadController)toast('新しいバージョンを取得しました');
  });
}
})();
